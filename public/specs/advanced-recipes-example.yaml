ingredients:
  flatbread:
    name: Flatbread
    category: base

    annotations:
      - type: note
        text: Store in an airtight container.

  yogurt-sauce:
    name: Yogurt Sauce

    recipe:
      $ref: '#/recipes/basic-yogurt-sauce'

  paprika:
    name: Paprika
    category: spice

equipment:
  cast-iron-pan:
    name: Cast Iron Pan
    category: cookware
    description: Heavy pan suitable for high heat cooking.

    uses:
      - searing
      - grilling

    annotations:
      - type: note
        text: Preheat thoroughly before use.

    media:
      - type: image
